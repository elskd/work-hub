<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Work Hub — рабочий день</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <aside class="sidebar">
      <a class="brand" href="#home"
        ><span class="brand-mark">w.</span
        ><span>Work Hub<small>Личное пространство</small></span></a
      >
      <nav id="desktop-nav" aria-label="Основная навигация"></nav>
      <div class="sidebar-foot">
        <span class="avatar">Э</span>
        <div>Эля<small>Первый этап · локальная версия</small></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="crumb"
          >Моё пространство <span>/</span> <b id="crumb">Главная</b></span
        ><span class="local-badge">● Только на этом устройстве</span>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer">
        Синхронизация между телефоном и Mac ещё не подключена.
      </footer>
    </div>
    <nav
      class="bottom-nav"
      id="mobile-nav"
      aria-label="Мобильная навигация"
    ></nav>
    <dialog id="editor" aria-labelledby="editor-title"></dialog>
    <dialog id="more" aria-labelledby="more-title">
      <div class="dialog-head">
        <h2 id="more-title">Все разделы</h2>
        <button class="icon-button" data-close="more" aria-label="Закрыть меню">
          ×
        </button>
      </div>
      <nav id="more-nav" aria-label="Все разделы"></nav>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
